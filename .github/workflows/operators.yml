name: Operator metadata checks
on:
  push:
    branches: [dev]
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: python -m pip install "torch>=2.9" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m compileall -q lazy_attention benchmarks tests
      - run: python -m unittest discover
      - run: python -m benchmarks.backward --help
      - run: python scripts/check_site.py
      - run: node scripts/check_optimization_models.js
      - run: node scripts/check_bank_model.js
      - run: node scripts/check_tutorial_models.js
